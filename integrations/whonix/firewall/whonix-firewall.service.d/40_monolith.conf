## systemd drop-in for whonix-firewall.service on the Workstation.
##
## DRAFT. Not yet run on Whonix. See docs/PLATFORM_WHONIX.md section 4.5.
##
## Install as
##   /usr/lib/systemd/system/whonix-firewall.service.d/40_monolith.conf
## and apply with: sudo systemctl daemon-reload
##                 sudo systemctl restart whonix-firewall
##
## This is the mechanism the Whonix wiki describes for custom firewall rules.
## Whonix marks it as unsupported. A manual "sudo whonix_firewall" reload
## rebuilds the ruleset without running this unit; the listener port is then
## closed until the service is restarted.

[Service]
ExecStartPost=/usr/libexec/monolith/monolith-listener-rule
