## Whonix-Workstation firewall drop-in for Monolith.
##
## DRAFT. Not yet run on Whonix. See docs/PLATFORM_WHONIX.md, open item W3.
##
## Install on the Workstation as /etc/whonix_firewall.d/40_monolith.conf,
## or put the line below into /usr/local/etc/whonix_firewall.d/50_user.conf.
## Reload with: sudo whonix_firewall
##
## Opens the one port the Gateway's Tor connects to for Monolith's Onion
## Service.

EXTERNAL_OPEN_PORTS+=" 29170 "
