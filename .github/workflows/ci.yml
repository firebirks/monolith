name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Minimum supported Rust version. Keep in sync with rust-version in
  # Cargo.toml and with docs/ARCHITECTURE.md section 10.
  MSRV: "1.85.1"

jobs:
  # Formatting and lints run on the developer toolchain pinned in
  # rust-toolchain.toml, so that results do not change with the runner image.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --workspace --locked

  # The documentation of every crate, with its intra-doc links checked.
  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo doc --workspace --no-deps --locked

  # The oldest compiler that must keep working. A dependency update that
  # needs a newer one fails here and has to be reviewed.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install "$MSRV" --profile minimal
      - run: cargo "+$MSRV" check --workspace --all-targets --locked
      - run: cargo "+$MSRV" test --workspace --locked

  # The newest stable compiler, to notice breakage before it reaches users
  # who build with it.
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --workspace --locked

  # The fuzz targets are a separate cargo project that needs nightly. This
  # job only checks that they still compile; it does not fuzz. `fuzzing` is
  # the configuration cargo-fuzz builds with; the session targets need the
  # fixed handshake keys that exist only under it.
  fuzz-build:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg fuzzing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly check --manifest-path fuzz/Cargo.toml --bins --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked cargo-audit@0.22.2
      - run: cargo audit

  # The Windows host tools of the P9-S laboratory (tools/p9s/host), which
  # are not part of Monolith: their synthetic tests and targeted mutants on
  # a runner with no VirtualBox, no laboratory configuration and no secret
  # store, which run-all.ps1 -CleanRunner checks first. The tests use mock
  # dispatchers, dry runs and simulations; they cannot show how a real VM
  # or the host under load behaves.
  p9s-windows-toolkit:
    name: p9s-windows-toolkit (shard ${{ matrix.shard }}/3)
    runs-on: windows-2025
    timeout-minutes: 90
    # Every shard runs every suite, then every third targeted fault of
    # tests/mutants.json (run-all.ps1 -MutantShard): the three shards together
    # run each fault exactly once. Each shard must succeed on its own.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: $PSVersionTable | Format-Table -AutoSize | Out-String -Width 200
      - run: pwsh -NoProfile -File tools/p9s/host/tests/run-all.ps1 -OutDir "$env:RUNNER_TEMP/p9s-tests" -Mutants -MutantShard ${{ matrix.shard }}/3 -CleanRunner
      # The toolkit needs PowerShell 7.4 or later; Windows PowerShell 5.1
      # must refuse it before any test starts.
      - run: |
          $out = & powershell.exe -NoProfile -File tools/p9s/host/tests/run-all.ps1 -OutDir "$env:RUNNER_TEMP/p9s-ps51" 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { "$_" }
          if ($code -eq 0 -or (Test-Path "$env:RUNNER_TEMP/p9s-ps51") -or "$out" -notmatch 'ScriptRequiresUnmatchedPSVersion') { 'Windows PowerShell 5.1 was not refused'; exit 1 }
          "Windows PowerShell $(& powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()') refused the entry point (exit $code)"
          exit 0
