# cargo-deny policy. Run with: cargo deny check

[graph]
all-features = true

[advisories]
yanked = "deny"
# Advisories may be ignored only with a written reason and a review date.
# The same advisories are ignored for cargo audit in .cargo/audit.toml.
# docs/DEPENDENCIES.md section 3 records each one.
ignore = [
    # quick-xml 0.38.4 comes only through zbus_xml 5.1.0, the newest
    # zbus_xml that builds with Rust 1.85; 5.1.1 and later need 1.87.
    # zbus_xml serves zbus-lockstep, which atspi-common uses in a procedural
    # macro, at build time, on the XML interface files shipped inside
    # atspi-common, and in its own tests. The desktop parses no XML when it
    # runs. Review on 2027-01-15.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml through zbus_xml parses only XML shipped in atspi-common, at build time; no fixed zbus_xml builds with Rust 1.85. Review 2027-01-15." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml through zbus_xml parses only XML shipped in atspi-common, at build time; no fixed zbus_xml builds with Rust 1.85. Review 2027-01-15." },
    # ttf-parser is unmaintained, with no release after 0.25.1. It parses
    # fonts for ab_glyph under epaint 0.32.3. Monolith gives it the fonts
    # compiled into the binary and the system fonts of the fixed list of
    # ADR 0012, each tried in a separate egui context before use; no font
    # comes from a peer. epaint 0.36 replaces it with skrifa and needs
    # Rust 1.95. Review on 2027-01-15.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser reads only bundled fonts and the fixed system fonts of ADR 0012; no egui that drops it builds with Rust 1.85. Review 2027-01-15." },
    # zvariant 5.9.2 and zbus_names 4.3.1 are unmaintained as crates of
    # their own: zbus 6 took them in as its wire and names modules. No
    # vulnerability is known. They come through zbus 5.13.2, the AT-SPI
    # bridge of accesskit_unix 0.15 under eframe 0.32.3, which the desktop
    # uses on Linux to speak to the session bus for accessibility; no peer
    # reaches D-Bus. zbus 6 needs Rust 1.89. Review on 2027-01-15.
    { id = "RUSTSEC-2026-0370", reason = "zvariant through zbus 5, the accessibility bridge of accesskit on Linux; unmaintained, no vulnerability; zbus 6 needs Rust 1.89. Review 2027-01-15." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names through zbus 5, the accessibility bridge of accesskit on Linux; unmaintained, no vulnerability; zbus 6 needs Rust 1.89. Review 2027-01-15." },
]

[licenses]
# Licences accepted for dependencies. Adding one is a reviewed change.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # clipboard-win and error-code, the Windows clipboard under arboard.
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The list is a policy, not a mirror of what is in use today.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are unpublished. They are MIT licensed; see LICENSE.
ignore = true

[bans]
# One version of each crate, in particular of each cryptographic crate.
multiple-versions = "deny"
# Crates that are only in the tree through development dependencies are not
# counted for that rule. This is the default of cargo-deny and is written
# out because one such pair exists: the property-test crate brings
# rand_core 0.9, and x25519-dalek depends on rand_core 0.10. Neither is a
# cryptographic implementation, and the first is in no product build. See
# docs/DEPENDENCIES.md section 4.
multiple-versions-include-dev = false
wildcards = "deny"
# Workspace crates refer to each other by path, without a version.
allow-wildcard-paths = true

# Second versions accepted in the window stack of the desktop client
# (eframe, winit, glutin, arboard, AccessKit), each by exact version. None
# is cryptographic. For rustix, linux-raw-sys, bitflags, syn, windows-sys
# and windows-link, which the core also uses, the version skipped is never
# the core's. getrandom has one version. A new version of any of these
# crates fails the check until it is reviewed. See docs/DEPENDENCIES.md
# section 4.
skip = [
    { crate = "rustix@0.38.44", reason = "winit 0.30, calloop 0.13 and smithay-client-toolkit 0.19 on Wayland; the vault uses rustix 1" },
    { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38 of the window stack" },
    { crate = "smithay-client-toolkit@0.19.2", reason = "winit 0.30 uses 0.19, smithay-clipboard 0.7 under egui-winit uses 0.20" },
    { crate = "calloop@0.13.0", reason = "winit 0.30 and its smithay-client-toolkit 0.19; 0.20 uses calloop 0.14" },
    { crate = "calloop-wayland-source@0.3.0", reason = "smithay-client-toolkit 0.19 of winit; 0.20 uses 0.4" },
    { crate = "thiserror@1.0.69", reason = "calloop 0.13, smithay-client-toolkit 0.19 and accesskit_atspi_common 0.12; the rest of the window stack uses 2" },
    { crate = "thiserror-impl@1.0.69", reason = "the derive of thiserror 1, build time" },
    { crate = "hashbrown@0.15.5", reason = "accesskit_consumer and the AccessKit platform crates; 0.17 is under toml_edit, build time" },
    { crate = "winnow@0.7.15", reason = "zbus and zvariant of the accessibility bus; 1.0 is under toml_edit, build time" },
    { crate = "quick-xml@0.38.4", reason = "zbus_xml 5.1.0, the newest that builds with Rust 1.85; wayland-scanner uses 0.41" },
    { crate = "syn@3.0.9", reason = "procedural macros of the window stack and tokio-macros, build time; the rest of the workspace uses syn 2" },
    { crate = "miniz_oxide@0.9.1", reason = "flate2 1.1.10 under png; png 0.18 itself uses miniz_oxide 0.8" },
    { crate = "windows-sys@0.52.0", reason = "glutin, glutin_egl_sys and winit on Windows; the rest of the workspace uses 0.61" },
    { crate = "windows-sys@0.59.0", reason = "eframe and rustix 0.38 on Windows; the rest of the workspace uses 0.61" },
    { crate = "windows-sys@0.60.2", reason = "arboard on Windows; the rest of the workspace uses 0.61" },
    { crate = "windows-targets@0.52.6", reason = "windows-sys 0.52 and 0.59; arboard's windows-sys 0.60 uses 0.53" },
    { crate = "windows_aarch64_gnullvm@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows_aarch64_msvc@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows_i686_gnu@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows_i686_gnullvm@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows_i686_msvc@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows_x86_64_gnu@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows_x86_64_gnullvm@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows_x86_64_msvc@0.52.6", reason = "windows-targets 0.52" },
    { crate = "windows-link@0.1.3", reason = "the windows 0.61 crates of accesskit_windows; the rest of the workspace uses 0.2" },
    # Platforms Monolith does not build for (docs/DESKTOP.md): macOS,
    # Android and Redox. The graph covers every target.
    { crate = "bitflags@1.3.2", reason = "core-graphics on macOS and redox_syscall 0.4 on Redox; the rest of the workspace uses bitflags 2" },
    { crate = "objc2@0.5.3", reason = "winit 0.30, eframe and accesskit_macos on macOS; arboard, glutin and webbrowser use 0.6" },
    { crate = "objc2-app-kit@0.2.2", reason = "winit 0.30, eframe and accesskit_macos on macOS" },
    { crate = "objc2-foundation@0.2.2", reason = "winit 0.30, eframe and accesskit_macos on macOS" },
    { crate = "jni-sys@0.3.1", reason = "ndk of winit on Android; jni 0.22 uses 0.4" },
    { crate = "redox_syscall@0.4.1", reason = "winit on Redox" },
    { crate = "redox_syscall@0.5.18", reason = "parking_lot_core on Redox" },
]

# Crates that would break an invariant just by being linked. See
# docs/SECURITY_INVARIANTS.md.
deny = [
    # S16, S29, S32: nothing fetches, previews or opens anything.
    { crate = "reqwest", reason = "no HTTP client (S16, S32)" },
    { crate = "hyper", reason = "no HTTP client (S16, S32)" },
    { crate = "ureq", reason = "no HTTP client (S16, S32)" },
    { crate = "curl", reason = "no HTTP client (S16, S32)" },
    { crate = "isahc", reason = "no HTTP client (S16, S32)" },
    { crate = "open", reason = "nothing is opened automatically (S16)" },
    { crate = "opener", reason = "nothing is opened automatically (S16)" },
    # eframe always enables egui-winit's `links` feature, which depends on
    # webbrowser. The desktop removes every request to open a URL from each
    # frame before eframe sees it (ADR 0010, S61, mutation fault UI16).
    # Nothing else may depend on it.
    { crate = "webbrowser", wrappers = ["egui-winit"], reason = "nothing is opened automatically (S16); egui-winit links it and the desktop strips every OpenUrl (ADR 0010, S61)" },
    # eframe links the PNG decoder of image for window icons, arboard links
    # it for clipboard images. The desktop builds its icon from pixels and
    # reads only text from the clipboard; no peer data reaches the decoder.
    # Nothing else may depend on it.
    { crate = "image", wrappers = ["eframe", "arboard"], reason = "no image decoding of peer data (S16); eframe and arboard link it, the desktop decodes no image" },
    # S3: no resolver.
    { crate = "hickory-resolver", reason = "no DNS resolution (S3)" },
    { crate = "trust-dns-resolver", reason = "no DNS resolution (S3)" },
    { crate = "dns-lookup", reason = "no DNS resolution (S3)" },
    # S17: one randomness source.
    #
    # The executor of the accessibility bus on Linux (async-executor,
    # futures-lite, piper, under zbus) uses fastrand to vary the order in
    # which it polls tasks, and tempfile (zbus on Windows, which Monolith
    # does not build there) for file names. No Monolith value comes from it.
    # Nothing else may depend on it.
    { crate = "fastrand", wrappers = ["async-executor", "futures-lite", "piper", "tempfile"], reason = "not a CSPRNG (S17); only the task scheduling of the accessibility bus uses it" },
    { crate = "oorandom", reason = "not a CSPRNG (S17)" },
    # Dependency control, not a verdict on OpenSSL's cryptography. Both bans
    # are explained in docs/DEPENDENCIES.md section 1.
    #
    # native-tls picks a different TLS implementation on each platform.
    # Monolith must not get its TLS stack chosen by the host it runs on.
    { crate = "native-tls", reason = "TLS implementation would depend on the host platform" },
    # openssl-sys is banned by default so that it cannot arrive unnoticed
    # through a dependency. ADR 0002 may lift this ban, in the open, if the
    # review of the session transport finds a strong technical reason.
    { crate = "openssl-sys", reason = "not without a decision in ADR 0002" },
]

# No cryptographic library is banned for the language it is written in.
# Candidates are evaluated on the criteria in docs/CRYPTOGRAPHY.md section 1.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
