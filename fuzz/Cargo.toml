[package]
name = "monolith-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
monolith-identity = { path = "../crates/monolith-identity" }
monolith-protocol = { path = "../crates/monolith-protocol" }
monolith-session = { path = "../crates/monolith-session" }
monolith-tor = { path = "../crates/monolith-tor" }

# This project is not a member of the main workspace. It needs a nightly
# toolchain and has its own lock file.
[workspace]

[profile.release]
debug = true
overflow-checks = true

# cargo-fuzz sets `--cfg fuzzing`. The session crate has code under it that
# gives the handshake targets fixed ephemeral keys.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[[bin]]
name = "base32"
path = "fuzz_targets/base32.rs"
test = false
doc = false
bench = false

