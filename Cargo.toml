[workspace]
resolver = "3"
members = [
    "crates/monolith-identity",
    "crates/monolith-protocol",
    "crates/monolith-session",
    "crates/monolith-tor",
    "crates/monolith-storage",
    "crates/monolith-core",
    "crates/monolith-cli",
    "crates/monolith-desktop",
]
# The fuzz targets are a separate cargo project with its own lock file. They
# need a nightly toolchain and must not affect the workspace build.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Minimum supported Rust version. 1.85.1 is the rustc in Debian 13, the base
# of the Tails and Whonix releases we target. This is not the developer
# toolchain, which is pinned in rust-toolchain.toml and may be newer. Raising
# this value is a reviewed change; see docs/ARCHITECTURE.md section 10.
rust-version = "1.85.1"
# Nothing in this workspace may be published without explicit authorization.
publish = false
license = "MIT"

[workspace.dependencies]
monolith-identity = { path = "crates/monolith-identity" }
monolith-protocol = { path = "crates/monolith-protocol" }
monolith-session = { path = "crates/monolith-session" }
monolith-tor = { path = "crates/monolith-tor" }
monolith-storage = { path = "crates/monolith-storage" }
monolith-core = { path = "crates/monolith-core" }

# Third-party crates. Each one is recorded in docs/DEPENDENCIES.md with what
# was checked before it was added. Features are off unless listed.
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
sha2 = { version = "0.11.0", default-features = false }
sha3 = { version = "0.11.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }

# The session layer. snow is the Noise state machine and is used without
# its own crypto: the resolver in monolith-session supplies X25519,
# ChaCha20-Poly1305 and SHA-256 from the three crates below it. See
# docs/adr/0002-session-protocol.md, F-R1.
snow = { version = "=0.10.0", default-features = false }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
getrandom = { version = "0.3.4", default-features = false }
zeroize = { version = "1.9.0", default-features = false }

# The Tor backend. tokio is the runtime of the network layer; hmac is the
# HMAC-SHA256 of SAFECOOKIE authentication.
tokio = { version = "1.53.1", default-features = false }
hmac = { version = "0.13.0", default-features = false }

# The vault. argon2 derives the key-encryption key from the passphrase,
# hkdf the payload key from the vault key; the AEAD is chacha20poly1305
# above. rustix takes the single-instance lock and reads the user id for
# the ownership check, which the standard library of the minimum Rust
# version cannot do without unsafe code. See docs/adr/0005-storage-encryption.md.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = { version = "=0.13.0", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "process"] }
# NFC for the vault passphrase only; the protocol never normalizes
# (docs/PROTOCOL.md section 9).
unicode-normalization = { version = "=0.1.25", default-features = false }

# Development only.
proptest = { version = "1.11", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"
# `fuzzing` is set by cargo-fuzz and by nothing else. Code under it supplies
# fixed handshake keys to the fuzz targets and does not exist in any other
# build; see docs/CRYPTOGRAPHY.md section 2.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
# Peer input must never be able to reach a panic. These lints remove the
# usual ways of writing one by accident.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
# Output goes through the logging layer, which redacts. The CLI crate opts
# out for its own stdout.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Argon2 at the parameters the vault accepts takes seconds without
# optimization. Test builds optimize it, so that the tests that open a
# vault run in reasonable time; nothing else changes.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
# Integer overflow is a bug in every Monolith crate. Trap it instead of
# wrapping silently.
overflow-checks = true
